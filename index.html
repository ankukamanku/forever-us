<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For My Anku ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff4d6d,#ff8fab);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
color:white;
padding:20px;
}

.box{
max-width:700px;
}

h1{
font-size:42px;
margin-bottom:20px;
}

p{
font-size:22px;
line-height:1.8;
}

button{
padding:15px 35px;
border:none;
border-radius:50px;
background:white;
color:#ff4d6d;
font-size:20px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}
</style>
</head>

<body>

<div class="box">

<h1 id="title">❤️ Dear Anku ❤️</h1>

<p id="text">
Mere paas tumhare liye ek chhota sa surprise hai... ❤️
</p>

<button onclick="nextPage()" id="btn">
Click Here ❤️
</button>

</div>

<script>

let page = 1;

function nextPage(){

if(page===1){
document.getElementById("title").innerHTML="🥰 Meri Anku";
document.getElementById("text").innerHTML=
"4 saal pehle mujhe bilkul nahi pata tha ki meri life mein itni sundar aur sakshat devi jaisi biwi aayegi. Main khud ko duniya ka sabse lucky insaan maanta hoon ki tum meri zindagi mein ho. ❤️";
page++;
}

else if(page===2){
document.getElementById("title").innerHTML="💕 Thank You";
document.getElementById("text").innerHTML=
"Har call ke liye, har message ke liye, har smile ke liye aur har us pal ke liye jo humne saath bitaya... Thank You Anku ❤️";
page++;
}

else if(page===3){
document.getElementById("title").innerHTML="🌹 Tumhari Baatein";
document.getElementById("text").innerHTML=
"❤️ Tumhari muskaan jo meri duniya roshan kar deti hai<br><br>❤️ Tumhari parwah jo mujhe hamesha apna hone ka ehsaas dilati hai<br><br>❤️ Tumhara pyaar jo meri zindagi ki sabse khoobsurat cheez hai<br><br>❤️ Tumhara saath jo har safar ko yaadgaar bana deta hai<br><br>❤️ Tumhara hona hi meri sabse badi khushi hai<br><br>❤️ Aur sabse khaas baat... Tum meri zindagi ka woh hissa ho jiske bina sab kuch adhura lagta hai. ❤️";
page++;
}

else if(page===4){
document.getElementById("title").innerHTML="💌 Dil Se";
document.getElementById("text").innerHTML=
"Meri zindagi ki sabse khoobsurat yaadon mein tumhara naam likha hua hai. Tum ho to sab kuch achha lagta hai. ❤️";
page++;
}

else if(page===5){
document.getElementById("title").innerHTML="❤️ I Love You Anku ❤️";
document.getElementById("text").innerHTML=
"Thank you meri jaan, in khoobsurat 4 saalon ke liye. Main har roz bhagwan ka shukriya karta hoon ki tum meri zindagi mein ho. ❤️<br><br>Forever Yours ❤️";
document.getElementById("btn").innerHTML="❤️ Forever ❤️";
page++;
}

}

</script>

</body>
</html>
